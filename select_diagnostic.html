<body>
  <h1>プルダウン診断</h1>

  <script>
    const eventLines = [];
    const eventNames = [
      "pointerdown",
      "pointerup",
      "touchstart",
      "touchend",
      "mousedown",
      "mouseup",
      "focus",
      "click",
      "input",
      "change"
    ];

    function addLog(message) {
      const now = new Date();
      const time = now.toLocaleTimeString("ja-JP", {
        hour12: false
      }) + "." + String(now.getMilliseconds()).padStart(3, "0");

      eventLines.push(time + " " + message);
      document.getElementById("eventLog").textContent =
        eventLines.slice(-80).join("\n");
    }

    function clearLog() {
      eventLines.length = 0;
      document.getElementById("eventLog").textContent =
        "まだ操作されていません";
    }

    function bindSelectEvents(id) {
      const select = document.getElementById(id);

      eventNames.forEach(eventName => {
        select.addEventListener(eventName, event => {
          addLog(
            id + " : " + event.type +
            " / value=" + select.value +
            " / trusted=" + event.isTrusted
          );
        }, { passive: true });
      });
    }

    function fillDynamicSelect() {
      const select = document.getElementById("dynamicSelect");
      const options = [
        ["", "選択してください"],
        ["dog", "いぬ"],
        ["cat", "ねこ"],
        ["monkey", "さる"]
      ];

      options.forEach(([value, text]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        select.appendChild(option);
      });
    }

    function tryShowPicker(id) {
      const select = document.getElementById(id);

      if (typeof select.showPicker !== "function") {
        addLog(id + " : showPicker()は未対応");
        alert("このブラウザはshowPicker()に対応していません");
        return;
      }

      try {
        addLog(id + " : showPicker()呼び出し開始");
        select.showPicker();
        addLog(id + " : showPicker()呼び出し成功");
      } catch (error) {
        const message =
          error.name + ": " + error.message;
        addLog(id + " : showPicker()失敗 / " + message);
        alert(message);
      }
    }

    function openFixedModal() {
      document.getElementById("fixedModal")
        .classList.add("open");
      addLog("fixedModal : open");
    }

    function closeFixedModal() {
      document.getElementById("fixedModal")
        .classList.remove("open");
      addLog("fixedModal : close");
    }

    function getEnvironmentText() {
      const viewport = window.visualViewport;
      const orientation =
        screen.orientation && screen.orientation.type
          ? screen.orientation.type
          : "取得不可";

      return [
        "URL: " + location.href,
        "hostname: " + location.hostname,
        "topLevel: " + (window.top === window.self),
        "userAgent: " + navigator.userAgent,
        "innerWidth x innerHeight: " +
          window.innerWidth + " x " + window.innerHeight,
        "screen.width x screen.height: " +
          screen.width + " x " + screen.height,
        "devicePixelRatio: " + window.devicePixelRatio,
        "orientation: " + orientation,
        "visualViewport: " +
          (
            viewport
              ? viewport.width + " x " + viewport.height +
                " / scale=" + viewport.scale
              : "取得不可"
          )
      ].join("\n");
    }

    function updateEnvironment(reason) {
      document.getElementById("environment").textContent =
        getEnvironmentText();

      if (reason) {
        addLog("environment : " + reason);
      }
    }

    fillDynamicSelect();

    [
      "staticSelect",
      "dynamicSelect",
      "disabledSelect",
      "modalSelect"
    ].forEach(bindSelectEvents);

    updateEnvironment("");

    window.addEventListener("resize", () => {
      updateEnvironment("resize");
    });

    window.addEventListener("orientationchange", () => {
      updateEnvironment("orientationchange");
    });
  </script>
